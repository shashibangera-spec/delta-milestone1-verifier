name: AMT Engine V1.0 daily research calculation

on:
  workflow_dispatch:
    inputs:
      session_date:
        description: "UTC session date (YYYY-MM-DD); blank = previous fully closed UTC session"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: amt-engine-daily-research
  cancel-in-progress: false

jobs:
  calculate:
    if: github.ref == 'refs/heads/feat/amt-engine-daily-v1-corrected'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.AMT_ENGINE_DATABASE_URL }}
      SESSION_DATE: ${{ inputs.session_date }}
      NEON_PROJECT_ID: old-surf-34279165
      NEON_BRANCH_ID: br-lingering-grass-ao07mgrx
      NEON_DATABASE_NAME: amt_research
    steps:
      - name: Check out approved feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/amt-engine-daily-v1-corrected
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline test suites
        run: python -m unittest discover -s tests -v
      - name: Validate database secret is configured
        shell: bash
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::Repository secret AMT_ENGINE_DATABASE_URL is not configured."
            exit 1
          fi
      - name: Execute one UTC session
        run: |
          if [ -n "${SESSION_DATE}" ]; then
            python -m amt_engine.daily_job --session-date "${SESSION_DATE}"
          else
            python -m amt_engine.daily_job
          fi
