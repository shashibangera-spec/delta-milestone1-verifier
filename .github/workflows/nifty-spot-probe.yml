name: Nifty 50 Spot read-only probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nifty-spot-readonly-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Fetch and compare public 15m spot data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" "yfinance>=0.2.66,<1" "requests>=2.32,<3"
          python -m pip install "git+https://github.com/marketcalls/openchart.git"
      - name: Run read-only probe
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/probe_nifty_spot.py
