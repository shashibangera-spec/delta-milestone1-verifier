name: Collector Regression Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "continuous_collector.py"
      - "oi_metrics.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/collector-tests.yml"
  push:
    branches: [fix/immutable-neon-historical-baseline]
    paths:
      - "continuous_collector.py"
      - "oi_metrics.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/collector-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest==8.3.4
      - name: Run repository unit tests
        run: python -m unittest discover -s tests -v
