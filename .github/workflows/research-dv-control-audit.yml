name: Research DV Control Audit

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

concurrency:
  group: research-dv-control-audit
  cancel-in-progress: false

jobs:
  offline-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project requirements
        run: python -m pip install -r requirements.txt
      - name: Compile and run offline self-tests
        run: |
          python -m compileall -q amt_engine scripts/research_dv_control_audit.py
          python scripts/research_dv_control_audit.py --self-test

  research:
    needs: offline-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project requirements
        run: python -m pip install -r requirements.txt
      - name: Validate required read-only credentials
        shell: bash
        env:
          V17_TARGET_READONLY_DATABASE_URL: ${{ secrets.V17_PROD_TARGET_READONLY_DATABASE_URL }}
          V17_SOURCE_READONLY_DATABASE_URL: ${{ secrets.V17_SOURCE_READONLY_DATABASE_URL }}
        run: |
          set -euo pipefail
          for name in V17_TARGET_READONLY_DATABASE_URL V17_SOURCE_READONLY_DATABASE_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required read-only secret mapped to $name is missing."
              exit 1
            fi
          done
      - name: Run read-only developing-value control audit
        env:
          V17_TARGET_READONLY_DATABASE_URL: ${{ secrets.V17_PROD_TARGET_READONLY_DATABASE_URL }}
          V17_SOURCE_READONLY_DATABASE_URL: ${{ secrets.V17_SOURCE_READONLY_DATABASE_URL }}
        run: python scripts/research_dv_control_audit.py
