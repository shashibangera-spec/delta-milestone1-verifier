name: Dashboard session selector tests

on:
  pull_request:
    branches:
      - milestone3-browser-dashboard
    paths:
      - "dashboard/app.py"
      - "dashboard/session_selection.py"
      - "dashboard/test_session_selection.py"
      - ".github/workflows/dashboard-session-tests.yml"
  push:
    branches:
      - ui/return-to-live-session

permissions:
  contents: read

jobs:
  session-selector-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run six session selector regression tests
        working-directory: dashboard
        run: python -m pytest -q test_session_selection.py
