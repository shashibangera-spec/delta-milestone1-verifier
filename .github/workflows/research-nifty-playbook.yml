name: Read-only NIFTY Pattern A research slice
on:
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: "Confirm this run is research-only and uses the amt_dashboard_ro database role"
        required: true
        type: choice
        options: ["I CONFIRM READ ONLY"]
permissions:
  contents: read
concurrency:
  group: nifty-playbook-readonly-research
  cancel-in-progress: false
jobs:
  research:
    if: github.event.inputs.confirm_read_only == 'I CONFIRM READ ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NIFTY_V17_READONLY_DATABASE_URL: ${{ secrets.NIFTY_V17_READONLY_DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install isolated research dependencies
        run: python -m pip install pytest==8.3.4 "pandas>=2.2,<3" "yfinance>=0.2.66,<1" "psycopg[binary]==3.2.3"
      - name: Run read-only historical NIFTY research
        run: python scripts/research_nifty_playbook_slice.py
