name: AMT Engine Daily Unit Tests

on:
  push:
    branches: [feat/amt-engine-daily-v1-corrected]
    paths:
      - "amt_engine/**"
      - "browser_dashboard/**"
      - "tests/test_amt_engine_daily.py"
      - "tests/test_amt_engine_daily_job.py"
      - ".github/workflows/amt-engine-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "amt_engine/**"
      - "browser_dashboard/**"
      - "tests/test_amt_engine_daily.py"
      - "tests/test_amt_engine_daily_job.py"
      - ".github/workflows/amt-engine-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r browser_dashboard/requirements.txt
          python -m pip install pytest==8.3.4
      - name: Compile v1.4 engine, logger, and dashboard
        run: python -m compileall -q amt_engine/playbook_v14.py amt_engine/playbook_v14_shadow_logger.py browser_dashboard/main.py tests/test_playbook_v14.py
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Run full offline AMT, Playbook, writer, and dashboard regression suite
        run: python -m pytest -q tests/test_v17_pipeline.py tests/test_v17_writer.py tests/test_v17_service.py tests/test_playbook_v13.py tests/test_playbook_v14.py tests/test_browser_dashboard.py
      - name: Run dashboard pytest regressions (offline only)
        run: python -m pytest -q tests/test_browser_dashboard.py
      - name: Build dashboard container image
        run: docker build -f browser_dashboard/Dockerfile -t btc-dashboard-ci .
