name: AMT Engine Daily Unit Tests

on:
  push:
    branches: [feat/amt-engine-daily-v1-corrected]
    paths:
      - "amt_engine/**"
      - "tests/test_amt_engine_daily.py"
      - "tests/test_amt_engine_daily_job.py"
      - ".github/workflows/amt-engine-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "amt_engine/**"
      - "tests/test_amt_engine_daily.py"
      - ".github/workflows/amt-engine-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run all offline unit tests
        run: python -m unittest discover -s tests -v
