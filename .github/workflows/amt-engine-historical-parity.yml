name: AMT Engine Historical Parity (Manual)

on:
  push:
    branches:
      - feat/amt-engine-daily-v1-corrected
  workflow_dispatch:
    inputs:
      execute_parity:
        description: "Explicitly authorize the database parity run (leave false for a no-op)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: amt-engine-historical-parity
  cancel-in-progress: false

jobs:
  offline-tests:
    name: Offline parity tests (no database credentials)
    if: github.ref == 'refs/heads/feat/amt-engine-daily-v1-corrected'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/amt-engine-daily-v1-corrected
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline parity tests
        run: python -m unittest tests.test_amt_engine_parity_check -v

      - name: Compile AMT engine and tests
        run: python -m compileall -q amt_engine tests

  connection-identity-preflight:
    name: Database connection identity preflight (read-only)
    if: github.ref == 'refs/heads/feat/amt-engine-daily-v1-corrected'
    needs: []
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PostgreSQL driver
        run: python -m pip install "psycopg[binary]==3.2.3"

      - name: Verify both secret connection identities
        env:
          LIVE_DATABASE_URL: ${{ secrets.LIVE_DATABASE_URL }}
          REFERENCE_DATABASE_URL: ${{ secrets.REFERENCE_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import sys
          import psycopg

          targets = (
              ("live", "LIVE_DATABASE_URL", "amt_dashboard_ro"),
              ("reference", "REFERENCE_DATABASE_URL", "amt_uat_ro"),
          )
          failures = []

          for label, env_name, expected_user in targets:
              url = os.environ.get(env_name)
              if not url:
                  print(f"{label}: connection secret is missing")
                  failures.append(label)
                  continue

              conn = None
              try:
                  conn = psycopg.connect(
                      url,
                      autocommit=False,
                      options="-c default_transaction_read_only=on",
                      connect_timeout=10,
                  )
                  with conn.cursor() as cur:
                      cur.execute("SET TRANSACTION READ ONLY")
                      cur.execute(
                          "SELECT current_user, session_user, "
                          "current_setting('transaction_read_only')"
                      )
                      current_user, session_user, read_only = cur.fetchone()

                  print(
                      f"{label}: current_user={current_user}; "
                      f"session_user={session_user}; "
                      f"transaction_read_only={read_only}"
                  )
                  if (
                      current_user != expected_user
                      or session_user != expected_user
                      or str(read_only).lower() != "on"
                  ):
                      failures.append(label)
              except Exception as exc:
                  # Deliberately omit exception text: drivers may include connection details.
                  print(f"{label}: connection/preflight failed ({type(exc).__name__})")
                  failures.append(label)
              finally:
                  if conn is not None:
                      try:
                          conn.rollback()
                      finally:
                          conn.close()

          if failures:
              print("FAIL CLOSED: identity/read-only preflight did not pass for: " + ", ".join(failures))
              sys.exit(1)
          print("PASS: both database identities and read-only transaction states verified")
          PY

  historical-parity:
    name: Historical parity (read-only)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/feat/amt-engine-daily-v1-corrected' &&
      inputs.execute_parity == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/amt-engine-daily-v1-corrected
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install parity dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run historical parity (read-only connections)
        env:
          LIVE_DATABASE_URL: ${{ secrets.LIVE_DATABASE_URL }}
          REFERENCE_DATABASE_URL: ${{ secrets.REFERENCE_DATABASE_URL }}
        run: python -m amt_engine.parity_check
