name: Session Journey Offline PR Check

on:
  pull_request:
    paths:
      - "scripts/research_session_journey_slice.py"
      - ".github/workflows/research-session-journey.yml"
      - ".github/workflows/session-journey-offline-pr-check.yml"

permissions:
  contents: read

jobs:
  offline-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project requirements
        run: python -m pip install -r requirements.txt
      - name: Compile and run offline self-tests
        run: |
          python -m compileall -q amt_engine scripts/research_session_journey_slice.py
          python scripts/research_session_journey_slice.py --self-test
