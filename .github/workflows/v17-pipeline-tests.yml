name: V1.7 backfill pipeline offline tests

on:
  push:
    branches:
      - feat/v17-historical-backfill-daily-pipeline
    paths:
      - "amt_engine/v17_pipeline.py"
      - "tests/test_v17_pipeline.py"
      - ".github/workflows/v17-pipeline-tests.yml"
      - "amt_engine/v17_writer.py"
      - "requirements.txt"
  pull_request:
    branches:
      - feat/amt-v17-least-priv-writer-dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v17-pipeline-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-pipeline-tests:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/v17-historical-backfill-daily-pipeline' || github.ref == 'refs/heads/feat/v17-historical-backfill-daily-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.4
      - name: Compile pipeline and writer
        run: python -m compileall -q amt_engine/v17_pipeline.py amt_engine/v17_writer.py tests/test_v17_pipeline.py
      - name: Run pipeline and writer offline tests
        run: python -m pytest -q tests/test_v17_pipeline.py tests/test_v17_writer.py tests/test_v17_service.py
