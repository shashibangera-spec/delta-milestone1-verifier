name: AMT Engine Final Branch Verification

on:
  push:
    branches: [feat/amt-engine-daily-v1-corrected]
    paths:
      - "amt_engine/**"
      - "tests/test_amt_engine_daily.py"
      - "tests/test_amt_engine_daily_job.py"
      - ".github/workflows/amt-engine-final-verification.yml"
  pull_request:
    branches: [main, amt-engine-v1-daily-uat]
    paths:
      - "amt_engine/**"
      - "tests/test_amt_engine_daily.py"
      - ".github/workflows/amt-engine-final-verification.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile AMT Engine package
        run: python -m compileall -q amt_engine
      - name: Run all offline unit tests
        run: python -m unittest discover -s tests -v
