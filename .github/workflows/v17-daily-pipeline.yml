name: V1.7 isolated daily pipeline

on:
  schedule:
    - cron: '12 0 * * *'
  workflow_dispatch:
    inputs:
      session_date:
        description: 'UTC session date to process (initial verification defaults to the already-complete 2026-11-23 session)'
        required: true
        type: string
        default: '2026-11-23'

permissions:
  contents: read

concurrency:
  group: v17-daily-pipeline
  cancel-in-progress: false

jobs:
  daily-pipeline:
    name: Run isolated V1.7 daily pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The writer credential is mapped to the exact variable expected by v17_pipeline.py.
      DATABASE_URL: ${{ secrets.V17_DEV_DATABASE_URL }}
      V17_SOURCE_DATABASE_URL: ${{ secrets.V17_SOURCE_DATABASE_URL }}
      V17_TARGET_READONLY_DATABASE_URL: ${{ secrets.V17_TARGET_READONLY_DATABASE_URL }}
      NEON_PROJECT_ID: old-surf-34279165
      NEON_BRANCH_ID: br-crimson-tooth-ao7oq469
      NEON_DATABASE_NAME: amt_research
      V17_SOURCE_BRANCH_ID: br-lingering-grass-ao07mgrx
      V17_TARGET_READ_BRANCH_ID: br-crimson-tooth-ao7oq469
      DISPATCH_SESSION_DATE: ${{ inputs.session_date }}
    steps:
      - name: Check out workflow branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate required credentials are present
        shell: bash
        run: |
          set -euo pipefail
          for name in DATABASE_URL V17_SOURCE_DATABASE_URL V17_TARGET_READONLY_DATABASE_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Actions secret for $name is missing."
              exit 1
            fi
          done

      - name: Run daily pipeline in APPLY mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$DISPATCH_SESSION_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::session_date must use YYYY-MM-DD."
              exit 1
            fi
            python -m amt_engine.v17_pipeline daily --session-date "$DISPATCH_SESSION_DATE" --apply | tee "$RUNNER_TEMP/v17-daily-output.json"
          else
            python -m amt_engine.v17_pipeline daily --apply | tee "$RUNNER_TEMP/v17-daily-output.json"
          fi

      - name: Verify target branch and expected session result
        env:
          EVENT_NAME: ${{ github.event_name }}
          SESSION_DATE: ${{ inputs.session_date }}
          OUTPUT_FILE: ${{ runner.temp }}/v17-daily-output.json
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import date, datetime, timedelta, timezone

          with open(os.environ["OUTPUT_FILE"], encoding="utf-8") as f:
              result = json.load(f)

          expected_source = "br-lingering-grass-ao07mgrx"
          expected_target = "br-crimson-tooth-ao7oq469"
          if result.get("mode") != "APPLY":
              sys.exit("Expected mode APPLY")
          if result.get("source_branch") != expected_source:
              sys.exit("Source branch identity mismatch")
          if result.get("target_branch") != expected_target:
              sys.exit("Target branch identity mismatch")

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              session_date = date.fromisoformat(os.environ["SESSION_DATE"])
          else:
              session_date = datetime.now(timezone.utc).date() - timedelta(days=1)

          key = session_date.isoformat()
          sessions = result.get("sessions", [])
          rows = [x for x in sessions if x.get("date") == key]
          if len(rows) != 1:
              sys.exit(f"Expected exactly one session summary for {key}; got {len(rows)}")

          outputs = [x for x in result.get("results", []) if x.get("date") == key]
          if len(outputs) != 1:
              sys.exit(f"Expected exactly one result for {key}; got {len(outputs)}")

          status = outputs[0].get("status")
          if os.environ["EVENT_NAME"] == "workflow_dispatch" and key == "2026-11-23":
              if status != "SKIPPED_COMPLETE":
                  sys.exit(f"Expected 2026-11-23 to return SKIPPED_COMPLETE; got {status!r}")
              if rows[0].get("action") != "SKIP_COMPLETE":
                  sys.exit("Session summary did not report SKIP_COMPLETE")
          elif status == "PERSISTED":
              identity = outputs[0].get("identity", {})
              if identity.get("identity_verified") is not True:
                  sys.exit("Writer database identity was not verified")
              if identity.get("branch_id") != expected_target:
                  sys.exit("Writer connected to an unexpected Neon branch")
              if identity.get("current_user") != "amt_v17_writer_login":
                  sys.exit("Writer connected with an unexpected database role")
              if outputs[0].get("snapshot_count") != 48:
                  sys.exit("Post-write snapshot verification did not report 48 rows")
              if outputs[0].get("oi_units_verified") is not True:
                  sys.exit("Post-write OI unit verification failed")
          elif status != "SKIPPED_COMPLETE":
              sys.exit(f"Unexpected daily pipeline result status: {status!r}")

          print(f"Verified {key}: {status}; source={expected_source}; target={expected_target}")
          PY
