name: V1.7 isolated least-privilege writer tests

on:
  push:
    branches:
      - feat/amt-v17-least-priv-writer-dev
    paths:
      - "amt_engine/v17_writer.py"
      - "amt_engine/v17_service.py"
      - "Dockerfile.v17"
      - "tests/test_v17_writer.py"
      - "tests/test_v17_service.py"
      - "tests/test_v17_writer_integration.py"
      - ".github/workflows/v17-writer-isolated-tests.yml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v17-writer-isolated-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  v17-writer-tests:
    if: github.ref == 'refs/heads/feat/amt-v17-least-priv-writer-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_PROJECT_ID: old-surf-34279165
      NEON_BRANCH_ID: br-crimson-tooth-ao7oq469
      NEON_DATABASE_NAME: amt_research
      V17_DEV_DATABASE_URL: ${{ secrets.V17_DEV_DATABASE_URL }}
    steps:
      - name: Check out isolated feature branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and pytest
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.4
      - name: Compile runner and tests
        run: python -m compileall -q amt_engine/v17_writer.py amt_engine/v17_service.py tests/test_v17_writer.py tests/test_v17_service.py tests/test_v17_writer_integration.py
      - name: Run offline boundary and identity tests
        run: python -m pytest -q tests/test_v17_writer.py tests/test_v17_service.py
      - name: Build dedicated V1.7 Docker image
        run: docker build --file Dockerfile.v17 --tag amt-v17-runner:ci .
      - name: Verify image default command is inert
        run: python -c "import json,subprocess; cmd=json.loads(subprocess.check_output(['docker','image','inspect','amt-v17-runner:ci','--format','{{json .Config.Cmd}}'],text=True)); assert cmd == ['python','-m','amt_engine.v17_service','idle'], cmd"
      - name: Run isolated Neon integration tests
        run: python -m pytest -q -rs tests/test_v17_writer_integration.py
