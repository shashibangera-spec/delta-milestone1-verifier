name: Nifty 50 Spot V1.7 offline tests
on:
  pull_request:
    branches: [main]
    paths: ["amt_engine/nifty_v17.py","tests/test_nifty_v17.py","browser_dashboard/main.py","browser_dashboard/requirements.txt","browser_dashboard/Dockerfile",".github/workflows/nifty-v17-offline-tests.yml",".github/workflows/nifty-v17-daily.yml"]
  push:
    branches: [feat/nifty-spot-v17-phase2]
    paths: ["amt_engine/nifty_v17.py","tests/test_nifty_v17.py","browser_dashboard/main.py","browser_dashboard/requirements.txt","browser_dashboard/Dockerfile",".github/workflows/nifty-v17-offline-tests.yml",".github/workflows/nifty-v17-daily.yml"]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install offline test dependencies
        run: |
          python -m pip install pytest==8.3.4 "pandas>=2.2,<3" "yfinance>=0.2.66,<1" "psycopg[binary]==3.2.3"
          python -m pip install -r browser_dashboard/requirements.txt
      - name: Compile Nifty engine and dashboard
        run: python -m compileall -q amt_engine/nifty_v17.py browser_dashboard/main.py tests/test_nifty_v17.py
      - name: Run Nifty offline tests
        run: python -m pytest -q tests/test_nifty_v17.py
      - name: Build browser dashboard image
        run: docker build -f browser_dashboard/Dockerfile -t market-amt-dashboard .
